<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG EVENT HOST - Pro Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-grid">
        <aside class="sidebar">
            <div class="logo">
                <i data-lucide="swords"></i> <span>EVENT HOST</span>
            </div>
            
            <div class="event-status">
                <label>ROUND TIMER</label>
                <div id="round-timer">50:00</div>
                <div class="timer-controls">
                    <button onclick="startRound()" id="start-btn"><i data-lucide="play"></i></button>
                    <button onclick="pauseRound()"><i data-lucide="pause"></i></button>
                </div>
            </div>

            <nav class="menu">
                <button onclick="switchTab('players')" class="active"><i data-lucide="users"></i> Players</button>
                <button onclick="switchTab('match')"><i data-lucide="layout"></i> Active Match</button>
                <button onclick="switchTab('standings')"><i data-lucide="list-ordered"></i> Standings</button>
                <button onclick="resetEvent()" class="danger"><i data-lucide="trash-2"></i> Reset Event</button>
            </nav>
        </aside>

        <main class="content">
            <section id="tab-players" class="tab-content active">
                <header class="section-header">
                    <h2>Event Registration</h2>
                    <div class="add-player">
                        <input type="text" id="player-name" placeholder="Player Name...">
                        <button onclick="addPlayer()">ADD PLAYER</button>
                    </div>
                </header>
                <ul id="player-list" class="list-view"></ul>
            </section>

            <section id="tab-match" class="tab-content">
                <div class="match-grid">
                    <div class="player-card p1">
                        <h1 id="m-p1-name">Player 1</h1>
                        <div class="life" id="m-p1-life">20</div>
                        <div class="life-ctrl">
                            <button onclick="modLife(1, -1)">-1</button>
                            <button onclick="modLife(1, 1)">+1</button>
                        </div>
                    </div>
                    <div class="match-vs">VS</div>
                    <div class="player-card p2">
                        <h1 id="m-p2-name">Player 2</h1>
                        <div class="life" id="m-p2-life">20</div>
                        <div class="life-ctrl">
                            <button onclick="modLife(2, -1)">-1</button>
                            <button onclick="modLife(2, 1)">+1</button>
                        </div>
                    </div>
                </div>
                <div class="match-footer">
                    <button class="submit-result" onclick="reportMatch()">REPORT RESULT</button>
                </div>
            </section>

            <section id="tab-standings" class="tab-content">
                <h2>Leaderboard</h2>
                <table id="standings-table">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Player</th>
                            <th>Points (3/1/0)</th>
                            <th>Matches</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body"></tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
