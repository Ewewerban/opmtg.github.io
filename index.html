<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTG Operator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <nav class="admin-bar">
        <div class="timer-container">
            <i data-lucide="timer"></i>
            <span id="game-timer">00:00:00</span>
        </div>
        <div class="admin-actions">
            <button onclick="toggleTimer()" id="timer-btn" class="btn-icon"><i data-lucide="play"></i></button>
            <button onclick="resetGame()" class="btn-icon"><i data-lucide="refresh-cw"></i></button>
            <button onclick="showHistory()" class="btn-icon"><i data-lucide="scroll"></i></button>
        </div>
    </nav>

    <main class="game-area">
        <section class="player-box p1" id="box-1">
            <div class="commander-damage-overlay" id="cd-1">CD: 0</div>
            <div class="player-info">
                <input type="text" value="PLAYER 1" class="name-input">
            </div>
            <div class="life-display">
                <button class="life-btn" onclick="adjustLife(1, -1)">-</button>
                <span class="life-total" id="life-1">40</span>
                <button class="life-btn" onclick="adjustLife(1, 1)">+</button>
            </div>
            <div class="quick-adjust">
                <button onclick="adjustLife(1, -5)">-5</button>
                <button onclick="adjustLife(1, 5)">+5</button>
            </div>
        </section>

        <section class="player-box p2" id="box-2">
            <div class="commander-damage-overlay" id="cd-2">CD: 0</div>
            <div class="player-info">
                <input type="text" value="PLAYER 2" class="name-input">
            </div>
            <div class="life-display">
                <button class="life-btn" onclick="adjustLife(2, -1)">-</button>
                <span class="life-total" id="life-2">40</span>
                <button class="life-btn" onclick="adjustLife(2, 1)">+</button>
            </div>
            <div class="quick-adjust">
                <button onclick="adjustLife(2, -5)">-5</button>
                <button onclick="adjustLife(2, 5)">+5</button>
            </div>
        </section>
    </main>

    <div id="history-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeHistory()">&times;</span>
            <h2>Historia Wyników</h2>
            <table id="leaderboard">
                <thead>
                    <tr>
                        <th>Czas</th>
                        <th>Zwycięzca</th>
                        <th>Wynik</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
